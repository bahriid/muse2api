name: GHCR image (bahri)

# Builds this fork for the home server (9Router "muse-free" provider).
on:
  push:
    branches: [bahri]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bahriid/muse2api:latest
            ghcr.io/bahriid/muse2api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
